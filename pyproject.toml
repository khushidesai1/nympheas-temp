[project]
name = "nympheas-qc"
version = "0.1.0"
description = "Out-of-core cell/gene QC filtering and normalization for multi-sample spatial transcriptomics AnnData zarr stores, distilled from nympheas."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.12",
    "dask[array]>=2025.1",
    "distributed>=2025.1",
    "fsspec",
    "numpy",
    "pandas",
    "scipy",
    "zarr>=3",
]

[project.optional-dependencies]
gcs = ["gcsfs"]
test = ["pytest", "scanpy"]

[project.scripts]
nympheas-qc = "nympheas_qc.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/nympheas_qc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
